name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/EnterpriseStarter.Api/EnterpriseStarter.Api.csproj

      - name: Build
        run: dotnet build src/EnterpriseStarter.Api/EnterpriseStarter.Api.csproj --no-restore --configuration Release

      - name: Unit checks
        run: dotnet run --project tests/EnterpriseStarter.Tests/EnterpriseStarter.Tests.csproj --configuration Release

      - name: Integration checks
        run: dotnet run --project tests/EnterpriseStarter.IntegrationTests/EnterpriseStarter.IntegrationTests.csproj --configuration Release
